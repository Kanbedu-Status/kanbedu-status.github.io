name: Monitor

on:
  schedule:
    # Avoids the start of the hour, when GitHub documents the longest delays.
    - cron: "3-58/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test message to the Discord channel
        type: boolean
        default: false

permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out main
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Run tests after a code change
        if: github.event_name == 'push'
        run: node --test

      - name: Restore state
        run: bash scripts/restore-state.sh

      - name: Run checks
        id: monitor
        # Runs on to save and deploy, then the last step reports the failure.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: node monitor/run.mjs --state state --site site --out _site --incidents incidents/incidents.json

      - name: Save state
        id: save
        # Also publishes status.json on the status-data branch, which the page reads.
        run: bash scripts/save-state.sh

      - name: Decide whether to deploy the site
        id: pages
        # The page reads live data from status-data, so Pages only needs a deploy
        # when the site changes, plus one an hour as a fallback copy of the data.
        # Deploying every 5 minutes left Pages stuck on old builds for hours.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$(date -u +%M)" -lt 5 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload site
        if: steps.pages.outputs.deploy == 'true'
        # v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - name: Deploy site
        id: deploy
        if: steps.pages.outputs.deploy == 'true'
        # A failed Pages deploy no longer hides live data, so it only fails the run
        # when it ships a site change.
        continue-on-error: ${{ github.event_name != 'push' }}
        # v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Keep the schedule enabled
        # GitHub disables schedules after 60 days without repository activity.
        # State pushes should count as activity. This is the second safeguard.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/enable" \
              || echo "::warning::Could not refresh the workflow schedule."
          fi

      - name: Report a monitor problem
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "::error::The monitor step failed. Read the Run checks step above."
          exit 1

      - name: Confirm the live data updated
        # The page reads status.json from the status-data branch. Confirm that copy
        # serves this run's data, so stale data on the page is noticed.
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        env:
          DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/status-data/status.json
        run: |
          want=$(node -p "require('./_site/data/status.json').generatedAt")
          got="unreadable"
          for attempt in $(seq 1 12); do
            got=$(curl -fsS "${DATA_URL}?run=${GITHUB_RUN_ID}-${attempt}" \
              | node -p "JSON.parse(require('fs').readFileSync(0)).generatedAt" || echo "unreadable")
            if [ "$got" = "$want" ]; then
              echo "Live data serves this run's data ($want)."
              exit 0
            fi
            sleep 10
          done
          # Up to 15 minutes late is normal. Past that, fail once when the data
          # first goes stale and once every 6 hours while it stays stale; the
          # runs in between warn, so one outage sends a handful of failure
          # emails, not one every 5 minutes
          # (scripts/live-page.mjs, test/live-page.test.mjs).
          read -r verdict lag < <(node scripts/live-page.mjs "$want" "$got")
          if [ "$verdict" = "warn" ]; then
            echo "::warning::The live data serves $got, ${lag}s behind this run ($want). It has not updated yet."
            exit 0
          fi
          echo "::error::The live data still serves $got after saving $want (${lag}s behind)."
          exit 1
