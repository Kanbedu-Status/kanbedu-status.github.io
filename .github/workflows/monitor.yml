name: Monitor

on:
  schedule:
    # Avoids the start of the hour, when GitHub documents the longest delays.
    - cron: "3-58/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test message to the Discord channel
        type: boolean
        default: false

permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out main
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        # v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Run tests after a code change
        if: github.event_name == 'push'
        run: node --test

      - name: Restore state
        run: bash scripts/restore-state.sh

      - name: Run checks
        id: monitor
        # Runs on to save and deploy, then the last step reports the failure.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: node monitor/run.mjs --state state --site site --out _site --incidents incidents/incidents.json

      - name: Save state
        run: bash scripts/save-state.sh

      - name: Upload site
        # v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

      - name: Deploy site
        id: deploy
        # v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

      - name: Keep the schedule enabled
        # GitHub disables schedules after 60 days without repository activity.
        # State pushes should count as activity. This is the second safeguard.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/enable" \
              || echo "::warning::Could not refresh the workflow schedule."
          fi

      - name: Report a monitor problem
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "::error::The monitor step failed. Read the Run checks step above."
          exit 1

      - name: Confirm the live page updated
        # Pages can report a deploy as successful and keep serving an older build
        # (seen 2026-11-07 to 11-08). Fail the run so the stale page is noticed.
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          want=$(node -p "require('./_site/data/status.json').generatedAt")
          got="unreadable"
          for attempt in $(seq 1 12); do
            got=$(curl -fsS "${PAGE_URL}data/status.json?run=${GITHUB_RUN_ID}-${attempt}" \
              | node -p "JSON.parse(require('fs').readFileSync(0)).generatedAt" || echo "unreadable")
            if [ "$got" = "$want" ]; then
              echo "Live page serves this run's data ($want)."
              exit 0
            fi
            sleep 10
          done
          # A publish that lands a few minutes late happens about once in 80 runs
          # and fixes itself on the next run. Fail only when the live data is
          # more than 15 minutes (three runs) behind, as on 2026-11-08.
          lag=$(WANT="$want" GOT="$got" node -p "const l = (Date.parse(process.env.WANT) - Date.parse(process.env.GOT)) / 1000; Number.isFinite(l) ? Math.round(l) : -1")
          if [ "$lag" -ge 0 ] && [ "$lag" -le 900 ]; then
            echo "::warning::The live page serves $got, ${lag}s behind this run ($want). Within 15 minutes, so not a failure."
            exit 0
          fi
          echo "::error::The live page still serves $got after deploying $want. GitHub Pages did not publish this deploy."
          exit 1
